<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Outer Boundary Ring -->
  <circle cx="50" cy="50" r="45" stroke="#171717" stroke-width="3" stroke-opacity="0.25" />
  
  <!-- Dynamic Orbit 1 (-30deg) -->
  <ellipse cx="50" cy="50" rx="45" ry="18" transform="rotate(-30 50 50)" stroke="#171717" stroke-width="3.5" />
  
  <!-- Dynamic Orbit 2 (+30deg dashed) -->
  <ellipse cx="50" cy="50" rx="45" ry="18" transform="rotate(30 50 50)" stroke="#737373" stroke-width="2.5" stroke-dasharray="7 5" />
  
  <!-- Inner Equilibrium Core -->
  <circle cx="50" cy="50" r="21" fill="#f1eee7" stroke="#d4cfc4" stroke-width="2.5" />
  
  <!-- Intelligent Nucleus (Terracotta Ochre) -->
  <circle cx="50" cy="50" r="10" fill="#c2410c" />
  
  <!-- Satellite Alignment Nodes -->
  <circle cx="83" cy="30" r="5" fill="#c2410c" />
  <circle cx="17.5" cy="70" r="4" fill="#171717" />
</svg>
