    <text x="150" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#999996">•</text>
    <text x="175" y="0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#525252">info@spherionix.com</text>
