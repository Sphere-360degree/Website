    <circle cx="14" cy="14" r="4" fill="#ea580c"/>
    <text x="26" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f8f7f4" letter-spacing="0.14em">SPHERIONIX • CONSULTING</text>
  </g>

