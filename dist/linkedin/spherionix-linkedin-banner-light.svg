    <line x1="360" y1="0" x2="360" y2="396"/>
    <line x1="600" y1="0" x2="600" y2="396"/>
    <line x1="840" y1="0" x2="840" y2="396"/>
    <line x1="1080" y1="0" x2="1080" y2="396"/>
    <line x1="1320" y1="0" x2="1320" y2="396"/>
    <line x1="0" y1="99" x2="1584" y2="99"/>
    <line x1="0" y1="198" x2="1584" y2="198"/>
    <line x1="0" y1="297" x2="1584" y2="297"/>
  </g>

  <!-- Right Side Accent Sphere System -->
  <g transform="translate(1340, 198)">
